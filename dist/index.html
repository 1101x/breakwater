<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16678e"><title>고민의 방파제</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#073c56;font-family:Arial,'Apple SD Gothic Neo',sans-serif}main{position:relative;width:100%;height:100dvh;overflow:hidden;background:#67baf0}canvas{display:block;width:100%;height:100%}form{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:480px;display:flex;align-items:center;gap:10px;padding:8px 9px 8px 21px;border:1px solid #ffffff75;border-radius:40px;background:#f6faf3e8;box-shadow:0 8px 35px #05233630;backdrop-filter:blur(18px)}input{min-width:0;flex:1;border:0;outline:0;background:none;color:#193e50;font-size:16px;line-height:28px;padding:6px 0}input::placeholder{color:#5d7781}button{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#17556c;color:white;display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s}button:active{transform:scale(.9)}button:disabled{background:#79939c;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #299bbb;outline-offset:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-aspect-ratio:4/5){main{max-width:600px;margin:auto;box-shadow:0 0 100px #001e3280}}@media(prefers-reduced-motion:reduce){button{transition:none}}
.sound-toggle{width:32px;height:40px;background:transparent;color:#366278}.sound-toggle:hover{background:#dae8eb}.sound-toggle .sound-slash{display:none}.sound-toggle.muted .sound-waves{display:none}.sound-toggle.muted .sound-slash{display:block}form{padding-left:12px;gap:8px}</style></head><body><main aria-label="고민이 파도에 흩어지는 바다"><form autocomplete="off"><button class="sound-toggle muted" type="button" aria-label="파도 소리 켜기" aria-pressed="false"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-waves" d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/><path class="sound-slash" d="m15 9 6 6m0-6-6 6"/></svg></button><input aria-label="바다에 내려놓을 고민" placeholder="고민을 쓰면, 파도가 데려가요" maxlength="160" enterkeyhint="send" disabled><button aria-label="고민 내려놓기" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form><span class="sr" role="status" aria-live="polite"></span></main><script type="module" src="./app.js"></script></body></html>
